# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and the gates that run on every pull
# request: `make verify`, a secret scan, semgrep, and workflow static analysis. CodeQL
# runs from codeql.yml.
#
# These gates block now. A branch ruleset on `main` (active 2026-08-22) refuses force
# pushes and deletions, requires every change to arrive as a merged pull request, and
# requires this workflow's four jobs plus osv-scanner's `scan` and CodeQL green before
# anything lands. It carries one bypass actor: the repository admin role at
# `bypass_mode: always`, which is the account that pushes, so those six checks are
# required by agreement for that account rather than by configuration. The committed
# copy is `.github/rulesets/main.json` and `.github/rulesets/README.md` says why the
# actor stays. This paragraph claimed none for nine days after `README.md`,
# `CHANGELOG.md`, `docs/ROADMAP.md` and `docs/RUNBOOK.md` were corrected on 2026-08-28,
# because the gate that forbids the claim read three Markdown documents and never read
# this file. Until the ruleset existed the gates reported and blocked nothing; this
# paragraph said so, because a gate that cannot go red is not a gate.
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-17
# via `gh api repos/OWNER/REPO/commits/TAG`. The pins stay `@<sha> # vX.Y.Z` so the
# version is readable next to the SHA.
#
# CI never touches the network for data. `data/raw/` is not in the repository, so the test
# suite runs against committed fixtures and the committed `published/` tree.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per commit on a push, one per branch on a pull request. A concurrency
  # group holds one *running* run and exactly one *pending* run; a third arrival evicts
  # the pending one with zero jobs ever dispatched. So a ref-only key makes every push
  # to `main` compete for a single slot, and a burst of merges deletes the verdict for
  # whichever commit was waiting: not a failure anyone can see, an absence.
  # `cancel-in-progress` neither causes nor prevents that -- it only decides whether the
  # loss is visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit on `main` its own slot. Pull request supersession
  # is unchanged: pull requests still share a per-ref group, so a new push to a branch
  # still cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      # Byte-for-byte the local target. `make verify` runs the lockfile-drift gate, ruff,
      # the formatter check, mypy --strict, pytest with the coverage floor, pip-audit, an
      # offline build over the fixtures, and the determinism gate.
      - name: make verify
        run: make verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The action lists the PR's commits to scope its scan to them. Read only.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Comments off, so the job needs nothing beyond contents:read. With them on the
      # action asks for pull-requests:write to annotate the PR and a least-privilege token
      # gets a 403 instead. Findings still fail the job and appear in the log.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit .

  # Nothing else in this repository reads the workflows themselves: `verify` never opens
  # them, gitleaks looks for secrets, and semgrep's p/python and p/security-audit rule
  # sets carry no GitHub Actions rules. This job and codeql.yml are what close that.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Online mode on purpose. zizmor defaults to offline and in that mode silently drops
      # the audits that need the API: whether a pinned SHA is still reachable from its tag,
      # and whether a `uses:` resolves upstream at all. A gate that quietly runs a subset
      # of itself is the failure mode this repository is trying not to have.
        with:
          enable-cache: true
      - name: workflow static analysis (zizmor, online)
        run: uvx --from zizmor==1.29.0 zizmor --format=plain .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
