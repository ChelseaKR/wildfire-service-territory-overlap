# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and the gates that run on every pull
# request: `make verify`, a secret scan, semgrep, and workflow static analysis. CodeQL
# runs from codeql.yml.
#
# These gates block now. A branch ruleset on `main` (active 2026-08-22) refuses force
# pushes and deletions, requires every change to arrive as a merged pull request, and
# requires this workflow's four jobs plus osv-scanner's `scan` and CodeQL green before
# anything lands. It carries one bypass actor: the repository admin role at
# `bypass_mode: always`, which is the account that pushes, so those six checks are
# required by agreement for that account rather than by configuration. The committed
# copy is `.github/rulesets/main.json` and `.github/rulesets/README.md` says why the
# actor stays. This paragraph claimed none for nine days after `README.md`,
# `CHANGELOG.md`, `docs/ROADMAP.md` and `docs/RUNBOOK.md` were corrected on 2026-08-28,
# because the gate that forbids the claim read three Markdown documents and never read
# this file. Until the ruleset existed the gates reported and blocked nothing; this
# paragraph said so, because a gate that cannot go red is not a gate.
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-17
# via `gh api repos/OWNER/REPO/commits/TAG`. The pins stay `@<sha> # vX.Y.Z` so the
# version is readable next to the SHA.
#
# CI never touches the network for data. `data/raw/` is not in the repository, so the test
# suite runs against committed fixtures and the committed `published/` tree. The served
# page is a rendering of `published/measurements.json`, which is committed, so `verify`
# rebuilds it and holds the committed bytes to it. The only network the `verify` job
# needs beyond the Python toolchain is npm and the Chromium download for the browser
# half of the WCAG gate; no page is served and no port is opened.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per commit on a push, one per branch on a pull request. A concurrency
  # group holds one *running* run and exactly one *pending* run; a third arrival evicts
  # the pending one with zero jobs ever dispatched. So a ref-only key makes every push
  # to `main` compete for a single slot, and a burst of merges deletes the verdict for
  # whichever commit was waiting: not a failure anyone can see, an absence.
  # `cancel-in-progress` neither causes nor prevents that -- it only decides whether the
  # loss is visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit on `main` its own slot. Pull request supersession
  # is unchanged: pull requests still share a per-ref group, so a new push to a branch
  # still cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 15 was the budget before the page toolchain arrived. `make verify` now also runs
    # `npm ci` twice and downloads a Chromium build, and a timeout below a job's real
    # runtime reads as a cancelled run rather than as a failed one, which is a verdict
    # nobody can act on. Measured on this job's first run with the page toolchain,
    # 2026-09-11, pull request #117: `make verify` took 82 seconds and the whole job 94,
    # with the Python cache restored. Locally, with everything cached, 37 seconds. 30
    # minutes is the sibling `perimeter` job's budget for the same work, and about
    # nineteen times the measured job.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      # `make node-sync` and `make browser-sync` run `npm ci`, which needs a node. The
      # version is pinned rather than floating, because npm's lockfile format depends on
      # it: a lockfile written by npm 11 is not installable by the npm 10 that node 22
      # ships, and the failure reads as a broken dependency rather than as a version
      # skew. Both package-lock.json files in this repository are written with npm 10.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # Byte-for-byte the local target. `make verify` runs the lockfile-drift gate, both
      # node toolchains, ruff, the formatter check, mypy --strict, pytest with the
      # coverage floor, pip-audit, an offline build over the fixtures, the determinism
      # gate, and the WCAG gate over the committed site/.
      - name: make verify
        run: make verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `pull-requests: read` and a `GITHUB_TOKEN` were here so the removed action could
      # list a pull request's commits and scope its scan to them. Nothing scopes the scan
      # now, so nothing needs to read the pull request.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Puts all 59 commits on disk. Necessary, and on its own not sufficient: what
          # the scanner reads is decided by how it is invoked, in the step below, not by
          # how much of the repository was fetched. This line was already here while the
          # check read one commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # This step used to be `gitleaks/gitleaks-action`, which picks its scan range
        # from the triggering event rather than scanning the repository: on a push it
        # runs `gitleaks detect --log-opts=--no-merges --first-parent BASE^..HEAD`, and
        # when the push carries a single commit it runs `--log-opts=-1`, exactly one
        # commit. Every squash merge into `main` is a single-commit push, and this
        # workflow has no `schedule` and no `workflow_dispatch`, so no lane here ever
        # read more than 1 of `main`'s 59 commits. A credential added in one commit and
        # deleted in the next was invisible to a required check named `secret-scan`.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with no
        # `--log-opts` is handed no range at all: it walks `git log --all`, every commit
        # the checkout above put on disk, whatever event triggered the run. Measured on
        # this job's first run, pull request #118: `91 commits scanned`, against the one
        # the action read. The checksum is the published one for the release, so a
        # substituted archive fails before it runs.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit .

  # Nothing else in this repository reads the workflows themselves: `verify` never opens
  # them, gitleaks looks for secrets, and semgrep's p/python and p/security-audit rule
  # sets carry no GitHub Actions rules. This job and codeql.yml are what close that.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Online mode on purpose. zizmor defaults to offline and in that mode silently drops
      # the audits that need the API: whether a pinned SHA is still reachable from its tag,
      # and whether a `uses:` resolves upstream at all. A gate that quietly runs a subset
      # of itself is the failure mode this repository is trying not to have.
        with:
          enable-cache: true
      - name: workflow static analysis (zizmor, online)
        run: uvx --from zizmor==1.29.0 zizmor --format=plain .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
