[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wildfire-service-territory-overlap"
version = "0.1.0"
description = "How much of California's wildfire damage-inspection record set can be attributed to a published electric service territory, measured rather than assumed"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Chelsea Kelly-Reif" },
]
readme = "README.md"
dependencies = [
  # The upstream acquisition. `perimeter` already measures the completeness of the DINS
  # file and already carries a paged walk that steps by rows received rather than by page
  # size. Re-implementing either would be re-implementing a bug that has already been
  # found and fixed once. Pinned to a commit, not a branch.
  #
  # Since `b35a8d67` every layer this project fetches goes through that walk. Upstream
  # #84 added an output format, which is what the three polygon layers needed and what
  # kept a second walk alive here; `docs/UPSTREAM.md` records the re-audit and what was
  # deleted.
  #
  # The distribution is `perimeter-wildfire` and the import name is still `perimeter`.
  # Upstream renamed the distribution because `perimeter` on PyPI is YunoJuno's Django
  # middleware; the package directory did not move. This line names the distribution, so
  # it had to move with it. Measured: with the new commit under the old name, `uv lock`
  # fails with "Package metadata name `perimeter-wildfire` does not match given name
  # `perimeter`", which reads as a bad revision rather than as a rename. Import sites are
  # unaffected.
  "perimeter-wildfire @ git+https://github.com/ChelseaKR/perimeter@b35a8d67ad1b04311663371acda1c561e520bb31",
  "shapely>=2.1",
  "pyproj>=3.7",
]

[dependency-groups]
dev = [
  "ruff>=0.15.0",
  "mypy>=1.18",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "pip-audit>=2.7",
]

[project.scripts]
wildfire-service-territory-overlap = "wildfire_service_territory_overlap.cli:main"

[tool.hatch.metadata]
# `perimeter` is a direct reference to a pinned commit rather than a PyPI release,
# because it has none. This project is not published to an index either, so the usual
# reason to forbid direct references does not apply here.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_service_territory_overlap"]

# --- single-source ruff/mypy/pytest config; repos change values, not keys ---

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is expected in tests
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# `shapely` ships no py.typed marker, so mypy reads it as untyped. `pyproj` was listed
# here too and had stopped earning it: pyproj 3.7.2 does ship the marker, and
# mypy --strict passes without the entry, measured 2026-09-05. An override that cannot
# fail is a rule nobody is following, so tests/test_provenance_and_standards.py now
# refuses an entry naming a package that carries the marker.
#
# `perimeter` was listed here until the pin moved to 3a6aa47, and both overrides that
# named it are gone with it. It now ships `src/perimeter/py.typed`, so that same rule
# would refuse the entry; and its `AcquisitionFailed` resolves to a real class rather
# than to `Any`, so `IncompleteAcquisition` subclasses it under `mypy --strict` with
# nothing relaxed. docs/UPSTREAM.md gap 4 records the measurement.
module = ["shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: > 2s",
  "integration: requires an external service",
  "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
# No omit list. acquire.py is run by hand and never in CI, which is true of the network
# call and false of the module: every refusal it makes is testable with the socket
# substituted, and tests/test_acquire.py does exactly that. Omitting it would let the
# floor pass over the module that carries this project's promises about somebody else's
# server and about not publishing a partial download as a whole one.
[tool.coverage.report]
fail_under = 90
show_missing = true
